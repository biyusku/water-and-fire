<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ates ve Su - Oyna</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }
    .topbar {
      width: 100%;
      background: rgba(0,0,0,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      height: 44px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white; padding: 5px 12px;
      border-radius: 6px; cursor: pointer;
      font-size: 0.8rem; text-decoration: none;
    }
    .back-btn:hover { background: rgba(255,255,255,0.18); }
    .topbar h1 {
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(90deg, #ff4500, #00bfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .controls-mini { display: flex; gap: 16px; font-size: 0.75rem; }
    .ctrl-fire { color: #ff5500; font-weight: 600; }
    .ctrl-water { color: #00aaff; font-weight: 600; }
    .topbar-right { display: flex; gap: 8px; }
    .icon-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white; padding: 5px 10px;
      border-radius: 6px; cursor: pointer;
      font-size: 0.85rem;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.2); }
    .game-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #canvas {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 44px);
    }
    :fullscreen .topbar { display: none; }
    :fullscreen #canvas { max-height: 100vh; }
    :-webkit-full-screen .topbar { display: none; }
    :-webkit-full-screen #canvas { max-height: 100vh; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="/" class="back-btn">Ana Sayfa</a>
      <h1>Ates ve Su</h1>
    </div>
    <div class="controls-mini">
      <span class="ctrl-fire">ATES: WASD</span>
      <span class="ctrl-water">SU: Ok Tuslari</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="sound-btn" onclick="toggleSound()">Ses Kapat</button>
      <button class="icon-btn" id="fs-btn" onclick="toggleFullscreen()">Tam Ekran</button>
    </div>
  </div>

  <div class="game-wrapper">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    // Ses sistemi
    let _actx = null;
    let soundEnabled = localStorage.getItem("soundEnabled") !== "false";
    document.getElementById("sound-btn").textContent = soundEnabled ? "Ses Kapat" : "Ses Ac";

    window.playSound = function(type) {
      if (!soundEnabled) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!_actx) _actx = new AC();
        const t = _actx.currentTime;
        if (type === "jump") {
          const o = _actx.createOscillator(), g = _actx.createGain();
          o.connect(g); g.connect(_actx.destination);
          o.type = "sine";
          o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(420, t + 0.12);
          g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          o.start(t); o.stop(t + 0.18);
        } else if (type === "death") {
          const o = _actx.createOscillator(), g = _actx.createGain();
          o.connect(g); g.connect(_actx.destination);
          o.type = "sawtooth";
          o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.5);
          g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
          o.start(t); o.stop(t + 0.5);
        } else if (type === "win") {
          [523, 659, 784, 1047].forEach(function(freq, i) {
            const o = _actx.createOscillator(), g = _actx.createGain();
            o.connect(g); g.connect(_actx.destination);
            const s = t + i * 0.13;
            o.type = "sine"; o.frequency.setValueAtTime(freq, s);
            g.gain.setValueAtTime(0.2, s); g.gain.exponentialRampToValueAtTime(0.001, s + 0.25);
            o.start(s); o.stop(s + 0.25);
          });
        } else if (type === "diamond") {
          const o = _actx.createOscillator(), g = _actx.createGain();
          o.connect(g); g.connect(_actx.destination);
          o.type = "sine";
          o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + 0.08);
          g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          o.start(t); o.stop(t + 0.12);
        }
      } catch(e) {}
    };

    function toggleSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem("soundEnabled", soundEnabled);
      document.getElementById("sound-btn").textContent = soundEnabled ? "Ses Kapat" : "Ses Ac";
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    }

    document.addEventListener("fullscreenchange", function() {
      const btn = document.getElementById("fs-btn");
      if (btn) btn.textContent = document.fullscreenElement ? "Cik" : "Tam Ekran";
    });
  </script>

  <!-- Oyun dogrudan bu sayfada calisir - iframe yok -->
  <!-- Tum asset path'leri public/game/ altinda -->
  <script>
    // Oyun res/ path'lerini public/game/res/ olarak yonlendir
    // main.js icindeki fetch('./res/data/...') cagrisi dogrudan URL'ye donusur
    // Bu nedenle base path'i ayarliyoruz
    window.__gameBasePath = '/public/game/';
  </script>
  <script type="module" src="/public/game/res/js/main.js"></script>
</body>
</html>
