<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ates ve Su - Oyna</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }
    .topbar {
      width: 100%;
      background: rgba(0,0,0,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      height: 44px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white; padding: 5px 12px;
      border-radius: 6px; cursor: pointer;
      font-size: 0.8rem; text-decoration: none;
    }
    .back-btn:hover { background: rgba(255,255,255,0.18); }
    .topbar h1 {
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(90deg, #ff4500, #00bfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .controls-mini { display: flex; gap: 16px; font-size: 0.75rem; }
    .ctrl-fire { color: #ff5500; font-weight: 600; }
    .ctrl-water { color: #00aaff; font-weight: 600; }
    .topbar-right { display: flex; gap: 8px; }
    .icon-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white; padding: 5px 10px;
      border-radius: 6px; cursor: pointer;
      font-size: 0.85rem;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.2); }
    .game-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="back-btn">Ana Sayfa</a>
      <h1>Ates ve Su</h1>
    </div>
    <div class="controls-mini">
      <span class="ctrl-fire">ATES: WASD</span>
      <span class="ctrl-water">SU: Ok Tuslari</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="sound-btn" onclick="toggleSound()">Ses Kapat</button>
      <button class="icon-btn" id="fs-btn" onclick="toggleFullscreen()">Tam Ekran</button>
    </div>
  </div>

  <div class="game-wrapper">
    <iframe
      id="game-frame"
      src="public/game/index.html"
      allowfullscreen
      allow="fullscreen"
    ></iframe>
  </div>

  <script>
    let soundEnabled = localStorage.getItem("soundEnabled") !== "false";
    document.getElementById("sound-btn").textContent = soundEnabled ? "Ses Kapat" : "Ses Ac";

    function toggleSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem("soundEnabled", soundEnabled);
      document.getElementById("sound-btn").textContent = soundEnabled ? "Ses Kapat" : "Ses Ac";
      // iframe icindeki oyuna mesaj gonder
      const iframe = document.getElementById("game-frame");
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: "soundToggle", enabled: soundEnabled }, "*");
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    }

    document.addEventListener("fullscreenchange", () => {
      const btn = document.getElementById("fs-btn");
      if (btn) btn.textContent = document.fullscreenElement ? "Cik" : "Tam Ekran";
    });
  </script>
</body>
</html>
