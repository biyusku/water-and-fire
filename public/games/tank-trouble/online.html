<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Battle</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#1a1a2e;color:#e0e0ff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .logo{font-size:2rem;font-weight:800;letter-spacing:1px;margin-bottom:4px;}
    .logo span{color:#ff6b35;}
    .tagline{color:#555;font-size:0.85rem;margin-bottom:24px;}
    .card{background:#12122a;border:1px solid #1e1e40;border-radius:16px;padding:28px 32px;width:min(460px,96vw);}

    /* name input */
    .field-label{font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:6px;}
    input.name-in{width:100%;background:#0e0e22;border:1px solid #1e1e40;border-radius:8px;padding:10px 14px;color:#e0e0ff;font-size:1rem;outline:none;margin-bottom:18px;}
    input.name-in:focus{border-color:#ff6b35;}

    /* character slots */
    .slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    .slot{border-radius:12px;padding:16px 12px;text-align:center;border:2px solid transparent;cursor:pointer;transition:all .15s;position:relative;user-select:none;}
    .slot:hover:not(.taken):not(.mine){filter:brightness(1.1);}
    .slot.red-slot{background:#ff6b3518;border-color:#ff6b3544;}
    .slot.blue-slot{background:#4fc3f718;border-color:#4fc3f744;}
    .slot.mine.red-slot{border-color:#ff6b35;background:#ff6b3530;box-shadow:0 0 0 2px #ff6b3555;}
    .slot.mine.blue-slot{border-color:#4fc3f7;background:#4fc3f730;box-shadow:0 0 0 2px #4fc3f755;}
    .slot.taken{opacity:.5;cursor:not-allowed;}
    .slot-icon{font-size:2rem;margin-bottom:6px;}
    .slot-name{font-size:0.95rem;font-weight:700;}
    .slot-player{font-size:0.75rem;color:#aaa;margin-top:4px;min-height:18px;}
    .slot-badge{position:absolute;top:6px;right:8px;font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:8px;}
    .badge-you{background:#7c6eff44;color:#7c6eff;}
    .badge-taken{background:#ff444433;color:#ff8888;}
    .badge-open{background:#4caf5033;color:#4caf50;}

    /* keys guide */
    .keys{display:flex;justify-content:space-between;gap:8px;margin-top:4px;padding:10px 0 0;}
    .key-col{flex:1;text-align:center;font-size:0.72rem;color:#555;line-height:1.9;}
    .key-col b{display:block;margin-bottom:4px;}
    .key-col.red b{color:#ff6b35;}
    .key-col.blue b{color:#4fc3f7;}
    kbd{background:#1f1f3a;border:1px solid #333;border-radius:4px;padding:1px 6px;font-family:monospace;font-size:0.75rem;color:#ccc;}

    /* status */
    .status{display:flex;align-items:center;gap:10px;background:#0e0e22;border-radius:10px;padding:11px 14px;font-size:0.83rem;color:#777;margin-top:4px;}
    .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#333;}
    .dot.amber{background:#ff9800;animation:blink 1.1s infinite;}
    .dot.green{background:#4caf50;}.dot.red-dot{background:#f44336;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

    /* arena */
    #arena{display:none;flex-direction:column;align-items:center;width:100%;height:100vh;}
    #topbar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 18px;background:#14142a;border-bottom:1px solid #1e1e40;flex-shrink:0;}
    #role-label{font-size:0.9rem;font-weight:600;}
    #p2p-badge{font-size:0.78rem;font-weight:700;padding:4px 14px;border-radius:20px;background:#ff9800;color:#fff;}
    #p2p-badge.ok{background:#4caf50;}#p2p-badge.lost{background:#f44336;}
    #game-frame{flex:1;width:100%;border:none;display:block;background:#000;}
  </style>
</head>
<body>

<div id="lobby">
  <div class="logo">Tank <span>Battle</span></div>
  <div class="tagline">Online 1v1 &middot; powered by VLV</div>
  <div class="card">
    <div class="field-label">Your name</div>
    <input class="name-in" id="player-name" placeholder="Enter your name…" maxlength="16" autocomplete="off" spellcheck="false">

    <!-- Character selection slots -->
    <div class="slots">
      <div class="slot red-slot" id="slot-red" onclick="pickSlot('host')">
        <div class="slot-icon">🔴</div>
        <div class="slot-name" style="color:#ff6b35">Red Tank</div>
        <div class="slot-player" id="slot-red-player">— open —</div>
        <span class="slot-badge badge-open" id="badge-red">Open</span>
      </div>
      <div class="slot blue-slot" id="slot-blue" onclick="pickSlot('guest')">
        <div class="slot-icon">🔵</div>
        <div class="slot-name" style="color:#4fc3f7">Blue Tank</div>
        <div class="slot-player" id="slot-blue-player">— open —</div>
        <span class="slot-badge badge-open" id="badge-blue">Open</span>
      </div>
    </div>

    <div class="status">
      <div class="dot" id="sdot"></div>
      <span id="stext">Choose your tank to start</span>
    </div>

    <div class="keys">
      <div class="key-col red"><b>🔴 Red — WASD + F</b>
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>F</kbd> shoot
      </div>
      <div class="key-col blue"><b>🔵 Blue — Arrows + L</b>
        <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> move &nbsp; <kbd>L</kbd> shoot
      </div>
    </div>
  </div>
</div>

<div id="arena">
  <div id="topbar">
    <span id="role-label">—</span>
    <span id="p2p-badge">Connecting P2P…</span>
  </div>
  <iframe id="game-frame" src="about:blank" allowfullscreen allow="autoplay"></iframe>
</div>

<script>
  var sp      = new URLSearchParams(location.search);
  var autostart = sp.get("autostart");   // "host"|"guest" — came from lobby
  var nameParam = sp.get("name");

  var myRole = null, myName = "Player", roomId = null, lobbyWs = null;
  // slots: { host: name|null, guest: name|null }
  var slots = { host: null, guest: null };

  // Pre-fill name from lobby
  if (nameParam) document.getElementById("player-name").value = decodeURIComponent(nameParam);

  function genId() { return Math.random().toString(36).slice(2,8).toUpperCase(); }

  function setStatus(msg, state) {
    document.getElementById("stext").textContent = msg;
    document.getElementById("sdot").className = "dot " + (state || "");
  }

  function renderSlots() {
    var roles = ["host", "guest"];
    var ids   = ["red",  "blue"];
    roles.forEach(function(role, i) {
      var slotEl   = document.getElementById("slot-" + ids[i]);
      var playerEl = document.getElementById("slot-" + ids[i] + "-player");
      var badgeEl  = document.getElementById("badge-" + ids[i]);
      var who      = slots[role];

      // Reset classes
      slotEl.classList.remove("mine", "taken");
      badgeEl.className = "slot-badge";

      if (who) {
        playerEl.textContent = who;
        if (role === myRole) {
          slotEl.classList.add("mine");
          badgeEl.classList.add("badge-you");
          badgeEl.textContent = "You";
        } else {
          slotEl.classList.add("taken");
          badgeEl.classList.add("badge-taken");
          badgeEl.textContent = "Taken";
        }
      } else {
        playerEl.textContent = "— open —";
        badgeEl.classList.add("badge-open");
        badgeEl.textContent = "Open";
      }
    });

    // Count filled
    var filled = (slots.host ? 1 : 0) + (slots.guest ? 1 : 0);
    if (filled === 2) {
      setStatus("Both players ready — connecting…", "amber");
    } else if (myRole) {
      setStatus("Waiting for opponent…", "amber");
    }
  }

  function pickSlot(role) {
    if (myRole) return;                   // already picked
    if (slots[role]) return;              // slot taken

    var n = document.getElementById("player-name").value.trim();
    if (!n) { setStatus("Enter your name first", "red-dot"); return; }

    myName = n;
    myRole = role;

    // Mark our slot immediately (optimistic)
    slots[role] = myName;
    renderSlots();

    startMatchmaking();
  }

  function startMatchmaking() {
    var safe     = myName.replace(/[^a-zA-Z0-9]/g, "").slice(0, 12) || "p";
    var playerId = (myRole === "host" ? "h-" : "g-") + safe + "-" + Math.random().toString(36).slice(2, 6);
    var gameId   = "tank-room-" + (roomId || genId());
    if (!roomId) roomId = gameId.replace("tank-room-", "");

    setStatus("Connecting to matchmaking…", "amber");

    fetch("https://vlvapi.rusk.agency/v1/matchmaking/join", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-VLV-API-Key": "254db297e6a785d586e237f5366dc722" },
      body: JSON.stringify({ player_id: playerId, game_id: "tank-room-" + roomId }),
    })
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data) {
      setStatus("Waiting for opponent…", "amber");
      openLobbyWs(data.ticket_id);
    })
    .catch(function(e) { setStatus("Error: " + e.message, "red-dot"); });
  }

  function openLobbyWs(tid) {
    lobbyWs = new WebSocket("wss://vlvlobby.rusk.agency/lobby?ticket=" + tid);
    lobbyWs.onmessage = function(e) {
      var m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === "matched") {
        lobbyWs.close();
        // Mark both slots as filled
        var otherRole = myRole === "host" ? "guest" : "host";
        if (!slots[otherRole]) slots[otherRole] = "Opponent";
        renderSlots();
        setStatus("Opponent found! Loading…", "green");
        setTimeout(function() { launchGame(m.token); }, 600);
      }
    };
    lobbyWs.onerror = function() { setStatus("Connection error", "red-dot"); };
  }

  function launchGame(token) {
    document.getElementById("lobby").style.display = "none";
    document.getElementById("arena").style.display = "flex";
    document.getElementById("role-label").textContent =
      myRole === "host"
        ? "🔴 " + myName + "  ·  WASD move  ·  F shoot"
        : "🔵 " + myName + "  ·  Arrow keys  ·  L shoot";

    var gameUrl = new URL("./game.html", location.href);
    gameUrl.searchParams.set("vlv",   "1");
    gameUrl.searchParams.set("role",  myRole);
    gameUrl.searchParams.set("token", token);
    gameUrl.searchParams.set("name",  encodeURIComponent(myName));
    gameUrl.searchParams.set("seed",  String((Date.now() % 99991) + 1));
    document.getElementById("game-frame").src = gameUrl.toString();
  }

  window.addEventListener("message", function(e) {
    if (!e.data || e.data.vlv == null) return;
    var b = document.getElementById("p2p-badge");
    if (e.data.vlv === "connected")    { b.textContent = "P2P Connected ✓"; b.className = "ok"; }
    if (e.data.vlv === "disconnected") { b.textContent = "Peer disconnected"; b.className = "lost"; }
  });

  // Auto-start when coming from lobby (both players already chose in lobby)
  if (autostart === "host" || autostart === "guest") {
    var n = nameParam ? decodeURIComponent(nameParam) : (autostart === "host" ? "Red" : "Blue");
    myName = n;
    myRole = autostart;
    roomId = sp.get("room") || genId();
    slots[autostart] = myName;
    // Disable name input — already set
    var inp = document.getElementById("player-name");
    inp.value    = myName;
    inp.disabled = true;
    renderSlots();
    startMatchmaking();
  }
</script>
</body>
</html>
