<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLV Games — Play Together</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d0d1a;color:#e0e0ff;font-family:'Segoe UI',sans-serif;min-height:100vh;}

    /* ── Header ── */
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid #1a1a30;}
    .brand{font-size:1.4rem;font-weight:800;letter-spacing:1px;}
    .brand span{color:#7c6eff;}
    .tagline{font-size:0.8rem;color:#444;}

    /* ── Layout ── */
    .layout{display:flex;height:calc(100vh - 64px);}

    /* ── Sidebar ── */
    .sidebar{width:280px;min-width:220px;border-right:1px solid #1a1a30;display:flex;flex-direction:column;padding:20px 16px;gap:12px;overflow-y:auto;}
    .sidebar-title{font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:#444;margin-bottom:4px;}
    .name-row{display:flex;gap:8px;}
    input.name-input{flex:1;background:#111125;border:1px solid #1e1e40;border-radius:8px;padding:9px 12px;color:#e0e0ff;font-size:0.9rem;outline:none;}
    input.name-input:focus{border-color:#7c6eff;}
    .create-btn{background:#7c6eff;border:none;border-radius:8px;color:#fff;padding:9px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;white-space:nowrap;}
    .create-btn:hover{background:#6a5ce0;}

    /* room code input */
    .join-row{display:flex;gap:8px;}
    input.code-input{flex:1;background:#111125;border:1px solid #1e1e40;border-radius:8px;padding:9px 12px;color:#e0e0ff;font-size:0.9rem;font-family:monospace;letter-spacing:2px;outline:none;text-transform:uppercase;}
    input.code-input:focus{border-color:#7c6eff;}
    .join-btn{background:#252540;border:none;border-radius:8px;color:#aaa;padding:9px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;white-space:nowrap;}
    .join-btn:hover{background:#333360;color:#fff;}

    .divider-line{border:none;border-top:1px solid #1a1a30;margin:4px 0;}

    /* room info */
    #room-info{display:none;background:#111125;border:1px solid #1e1e40;border-radius:10px;padding:12px;}
    .room-code{font-family:monospace;font-size:1.1rem;color:#7c6eff;font-weight:700;letter-spacing:3px;}
    .room-sub{font-size:0.72rem;color:#444;margin-top:2px;}
    .copy-link-btn{margin-top:8px;width:100%;background:#1e1e35;border:none;border-radius:6px;color:#888;padding:6px;font-size:0.78rem;cursor:pointer;}
    .copy-link-btn:hover{color:#fff;}
    .copy-link-btn.copied{color:#4caf50;}

    /* players list */
    #players-list{display:flex;flex-direction:column;gap:6px;}
    .player-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#111125;border-radius:8px;font-size:0.85rem;}
    .player-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;flex-shrink:0;}
    .player-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .player-you{font-size:0.7rem;color:#7c6eff;font-weight:700;}
    .player-host-badge{font-size:0.65rem;background:#7c6eff22;color:#7c6eff;padding:1px 6px;border-radius:4px;}

    /* status */
    .status-bar{background:#111125;border:1px solid #1a1a30;border-radius:8px;padding:10px 12px;font-size:0.8rem;color:#555;display:flex;align-items:center;gap:8px;}
    .dot{width:7px;height:7px;border-radius:50%;background:#333;flex-shrink:0;}
    .dot.green{background:#4caf50;}.dot.amber{background:#ff9800;animation:blink 1.1s infinite;}.dot.red{background:#f44336;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* ── Main area ── */
    .main{flex:1;overflow-y:auto;padding:28px 32px;}
    .main-title{font-size:1.1rem;font-weight:700;margin-bottom:20px;color:#e0e0ff;}
    .games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}

    .game-card{background:#111125;border:1px solid #1e1e40;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;}
    .game-card:hover{transform:translateY(-3px);border-color:#7c6eff;}
    .game-card.locked{opacity:.4;cursor:not-allowed;pointer-events:none;}
    .game-card.selected{border-color:#7c6eff;box-shadow:0 0 0 2px #7c6eff44;}

    .game-thumb{width:100%;height:120px;object-fit:cover;display:block;background:#0e0e20;}
    .game-thumb-placeholder{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:linear-gradient(135deg,#1a1a35,#0e0e22);}
    .game-info{padding:12px 14px;}
    .game-name{font-size:0.92rem;font-weight:700;margin-bottom:3px;}
    .game-desc{font-size:0.72rem;color:#555;line-height:1.4;}
    .game-badge{position:absolute;top:8px;right:8px;font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#7c6eff22;color:#7c6eff;border:1px solid #7c6eff44;}
    .game-badge.soon{background:#ff980022;color:#ff9800;border-color:#ff980044;}

    /* play button */
    .play-btn{width:100%;padding:11px;background:#7c6eff;border:none;border-radius:10px;color:#fff;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:12px;display:none;}
    .play-btn:hover{background:#6a5ce0;}
    #play-area{padding-top:8px;}

    @media(max-width:640px){
      .sidebar{width:100%;border-right:none;border-bottom:1px solid #1a1a30;}
      .layout{flex-direction:column;height:auto;}
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="brand">VLV <span>Games</span></div>
    <div class="tagline">Play together — powered by VLV multiplayer</div>
  </div>
</header>

<div class="layout">
  <!-- Sidebar: room + players -->
  <aside class="sidebar">
    <div class="sidebar-title">Your Name</div>
    <div class="name-row">
      <input class="name-input" id="player-name" placeholder="Enter name…" maxlength="16" autocomplete="off" spellcheck="false" />
    </div>

    <hr class="divider-line">
    <div class="sidebar-title">Create Room</div>
    <button class="create-btn" id="create-btn" onclick="createRoom()">+ New Room</button>

    <div class="sidebar-title" style="margin-top:4px;">Join Room</div>
    <div class="join-row">
      <input class="code-input" id="code-input" placeholder="ROOM CODE" maxlength="6" />
      <button class="join-btn" onclick="joinRoom()">Join</button>
    </div>

    <hr class="divider-line">

    <!-- Room info (shown after create/join) -->
    <div id="room-info">
      <div class="room-code" id="room-code-display">——</div>
      <div class="room-sub">Share this code with your friend</div>
      <button class="copy-link-btn" id="copy-link-btn" onclick="copyRoomLink()">Copy invite link</button>
    </div>

    <!-- Players in room -->
    <div class="sidebar-title" id="players-title" style="display:none">In Room</div>
    <div id="players-list"></div>

    <hr class="divider-line">
    <div class="status-bar">
      <div class="dot" id="sdot"></div>
      <span id="stext">Enter your name and create a room</span>
    </div>

    <!-- Play button (host only, after selecting a game) -->
    <div id="play-area">
      <button class="play-btn" id="play-btn" onclick="startGame()">▶ Start Game</button>
    </div>
  </aside>

  <!-- Main: game selection -->
  <main class="main">
    <div class="main-title">Choose a Game</div>
    <div class="games-grid" id="games-grid"></div>
  </main>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
var VLV_API = "https://vlvapi.rusk.agency";
var VLV_API_KEY = "254db297e6a785d586e237f5366dc722";
var LOBBY_WS_BASE = "wss://vlvlobby.rusk.agency";
var SIGNAL_WS_BASE = "wss://vlvsignal.rusk.agency";

// ── Games catalog ─────────────────────────────────────────────────────────────
var GAMES = [
  {
    id: "cats-cradle",
    name: "Cat's Cradle",
    desc: "Two players connected by a rope — co-op puzzle platformer",
    emoji: "🐱",
    url: "/games/cats-cradle/online.html",
    available: false,
    badge: "soon"
  }
  // More games added here
];

// ── State ─────────────────────────────────────────────────────────────────────
var myName    = "";
var roomCode  = null;
var isHost    = false;
var players   = {};   // { socketId: { name, isHost } }
var myId      = null;
var roomWs    = null; // local room WebSocket (our server)
var selectedGame = null;

// ── Render games ──────────────────────────────────────────────────────────────
function renderGames() {
  var grid = document.getElementById("games-grid");
  grid.innerHTML = "";
  GAMES.forEach(function(g) {
    var card = document.createElement("div");
    card.className = "game-card" + (g.available === false ? " locked" : "");
    card.id = "game-card-" + g.id;
    card.onclick = function() { if (g.available !== false) selectGame(g); };
    card.innerHTML =
      '<div class="game-thumb-placeholder">' + g.emoji + '</div>' +
      '<div class="game-info">' +
        '<div class="game-name">' + g.name + '</div>' +
        '<div class="game-desc">' + g.desc + '</div>' +
      '</div>' +
      (g.badge ? '<div class="game-badge ' + (g.badge==="soon"?"soon":"") + '">' + (g.badge==="soon"?"Coming Soon":"") + '</div>' : '');
    grid.appendChild(card);
  });
}
renderGames();

// ── Room creation / joining ───────────────────────────────────────────────────
function getName() {
  var v = document.getElementById("player-name").value.trim();
  if (!v) { setStatus("Enter your name first", "red"); return null; }
  return v;
}

function createRoom() {
  var name = getName(); if (!name) return;
  myName = name;
  isHost = true;
  roomCode = Math.random().toString(36).slice(2,8).toUpperCase();
  myId = "h-" + roomCode + "-" + Math.random().toString(36).slice(2,5);
  openRoomWs();
}

function joinRoom() {
  var name = getName(); if (!name) return;
  var code = document.getElementById("code-input").value.trim().toUpperCase();
  if (code.length < 4) { setStatus("Enter a valid room code", "red"); return; }
  myName = name;
  isHost = false;
  roomCode = code;
  myId = "g-" + roomCode + "-" + Math.random().toString(36).slice(2,5);
  openRoomWs();
}

// ── Room WebSocket (our own server) ──────────────────────────────────────────
function openRoomWs() {
  var proto = location.protocol === "https:" ? "wss" : "ws";
  var url = proto + "://" + location.host + "/room-ws?code=" + roomCode +
            "&name=" + encodeURIComponent(myName) +
            "&host=" + (isHost ? "1" : "0") +
            "&id=" + encodeURIComponent(myId);

  roomWs = new WebSocket(url);

  roomWs.onopen = function() {
    setStatus(isHost ? "Room created! Share the code." : "Joining room…", "amber");
    showRoomInfo();
  };

  roomWs.onmessage = function(e) {
    var m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "room_state") {
      players = m.players;
      renderPlayers();
      setStatus(Object.keys(players).length + " player(s) in room", "green");
    } else if (m.type === "start_game" && !isHost) {
      // Host started the game — we follow
      launchGame(m.game, m.token, m.role);
    } else if (m.type === "error") {
      setStatus(m.msg, "red");
    }
  };

  roomWs.onerror = function() { setStatus("Connection error", "red"); };
  roomWs.onclose = function() { setStatus("Disconnected", "red"); };
}

function showRoomInfo() {
  document.getElementById("room-info").style.display = "block";
  document.getElementById("room-code-display").textContent = roomCode;
  document.getElementById("players-title").style.display = "block";
}

function copyRoomLink() {
  var url = location.origin + "/?room=" + roomCode;
  navigator.clipboard.writeText(url).then(function() {
    var btn = document.getElementById("copy-link-btn");
    btn.textContent = "Copied!"; btn.classList.add("copied");
    setTimeout(function(){ btn.textContent = "Copy invite link"; btn.classList.remove("copied"); }, 2000);
  });
}

// Check URL for room code (direct invite link)
(function checkInviteUrl() {
  var params = new URLSearchParams(location.search);
  var code = params.get("room");
  if (code) {
    document.getElementById("code-input").value = code.toUpperCase();
    setStatus("Room code " + code.toUpperCase() + " — enter your name and click Join", "amber");
  }
})();

// ── Players list ──────────────────────────────────────────────────────────────
function renderPlayers() {
  var list = document.getElementById("players-list");
  list.innerHTML = "";
  Object.keys(players).forEach(function(id) {
    var p = players[id];
    var item = document.createElement("div");
    item.className = "player-item";
    item.innerHTML =
      '<div class="player-dot"></div>' +
      '<div class="player-name">' + escHtml(p.name) + '</div>' +
      (p.isHost ? '<span class="player-host-badge">host</span>' : '') +
      (id === myId ? '<span class="player-you">you</span>' : '');
    list.appendChild(item);
  });
}

// ── Game selection ────────────────────────────────────────────────────────────
function selectGame(game) {
  selectedGame = game;
  // Highlight selected card
  document.querySelectorAll(".game-card").forEach(function(c) { c.classList.remove("selected"); });
  var card = document.getElementById("game-card-" + game.id);
  if (card) card.classList.add("selected");

  // Show play button only for host
  if (isHost && roomCode) {
    document.getElementById("play-btn").style.display = "block";
  } else if (!roomCode) {
    setStatus("Create a room first, then select a game", "amber");
  }
}

// ── Start game (host triggers, guest follows via WS) ──────────────────────────
function startGame() {
  if (!roomWs || roomWs.readyState !== WebSocket.OPEN) {
    setStatus("Not in a room", "red"); return;
  }
  if (!selectedGame) {
    setStatus("Select a game first", "amber"); return;
  }
  if (Object.keys(players).length < 2) {
    setStatus("Waiting for another player to join…", "amber"); return;
  }

  setStatus("Starting game…", "amber");
  // Tell server to initiate VLV matchmaking for both players
  roomWs.send(JSON.stringify({ type: "start_game", game: selectedGame.id }));
}

// ── Launch iframe ─────────────────────────────────────────────────────────────
function launchGame(gameId, token, role) {
  var game = GAMES.find(function(g){ return g.id === gameId; });
  if (!game) return;
  var url = new URL(game.url, location.href);
  url.searchParams.set("vlv", "1");
  url.searchParams.set("role", role);
  url.searchParams.set("token", token);
  url.searchParams.set("name", encodeURIComponent(myName));
  window.location.href = url.toString();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(msg, state) {
  document.getElementById("stext").textContent = msg;
  document.getElementById("sdot").className = "dot " + (state||"");
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
